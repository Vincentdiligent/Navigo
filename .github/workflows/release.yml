name: Release APK

# Builds the Android release APK on GitHub's own runners and publishes it to
# GitHub Releases. Two ways to start it:
#
#   * push a tag  v6.9.0   -> full GitHub Release with the APKs attached
#   * "Run workflow" button -> build + downloadable artifact, no release
#
# The signing identity is NOT in this repository. It is injected from the
# repository secrets listed in the README under "Releases". Without them the
# build still runs and still produces an APK, but that APK is signed with the
# throwaway debug key of the runner, so it cannot be installed over a Navigo
# that is already on a phone.

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "ABI to build"
        required: false
        default: "android-arm64"
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-arm,android-arm64
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Drop machine-local Gradle settings
        # android/gradle.properties pins org.gradle.java.home to a JDK path
        # that only exists on the developer's Windows laptop. On the runner,
        # JAVA_HOME from setup-java is the right answer, so drop the line.
        run: sed -i '/^org.gradle.java.home=/d' android/gradle.properties

      - name: Make sure compileSdk 36 is installed
        # 36 is Flutter 3.44's default flutter.compileSdkVersion. Runner images
        # do not always carry the newest platform, and AGP's own download is not
        # guaranteed to be allowed for it.
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$sdk"
          ls "$sdk/platforms" || true
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$sdk/platforms/android-36" ] && [ -x "$mgr" ]; then
            yes | "$mgr" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Read the version from pubspec.yaml
        id: ver
        run: |
          raw=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | tr -d '\r')
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"
          echo "full=$raw" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $raw"

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "${{ steps.ver.outputs.name }}" ]; then
            echo "::warning::tag v$tag does not match pubspec.yaml version ${{ steps.ver.outputs.name }}"
          fi

      - name: Restore the signing identity
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_FILE_NAME: ${{ secrets.KEYSTORE_FILE_NAME }}
        run: |
          set -eu
          name="${KEYSTORE_FILE_NAME:-navigo.keystore}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "android/app/$name"
          {
            printf 'storeFile=%s\n' "$name"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/app/key.properties
          chmod 600 android/app/*.keystore android/app/key.properties
          echo "signing identity restored as android/app/$name"

      - name: Warn when there is no signing identity
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::KEYSTORE_BASE64 is not set, so this APK is signed"
          echo "::warning::with the runner's throwaway debug key and cannot be"
          echo "::warning::installed over an existing Navigo. See README Releases."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform "${{ inputs.target_platform || 'android-arm64' }}"

      - name: Collect artifacts
        run: |
          set -eu
          mkdir -p out
          v=${{ steps.ver.outputs.full }}
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "out/Navigo-${v}-${abi}.apk"
          done
          ls -la out

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          {
            printf '## Navigo %s\n\n' "$GITHUB_REF_NAME"
            printf 'Built by GitHub Actions from this tag on a clean runner:\n\n'
            printf '```\nflutter build apk --release --split-per-abi --target-platform android-arm64\n```\n\n'
            printf '| File | ABI | Install on |\n| --- | --- | --- |\n'
            printf '| `*-arm64-v8a-release.apk` | arm64 | almost every phone since 2019 |\n'
            printf '| `*-armeabi-v7a-release.apk` | arm 32-bit | older and budget devices |\n\n'
            printf 'Map data (c) OpenStreetMap contributors, tiles by OpenFreeMap -\n'
            printf 'the README carries the full data and license list.\n'
          } > release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Navigo $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            out/*.apk

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Navigo-${{ steps.ver.outputs.full }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
