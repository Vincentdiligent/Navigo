name: Release APK

# Builds the Android release APK on GitHub's own runners and publishes it to
# GitHub Releases. Two ways to start it:
#
#   * push a tag  v6.9.0   -> full GitHub Release with the APKs attached
#   * "Run workflow" button -> build + downloadable artifact, no release
#
# The signing identity is NOT in this repository. To publish signed releases,
# create these protected repository secrets (Settings → Secrets and variables
# → Actions): KEYSTORE_BASE64 (the keystore, base64-encoded), KEYSTORE_FILE_NAME
# (the file name storeFile expects), KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD.
# Only names appear here; the values never enter the repository or the logs.
# A tag is published as a GitHub Release only when those secrets exist; without
# them the build still produces an APK, but it carries the runner's throwaway
# debug key, so it is kept as a build artifact instead of being released.

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "ABI to build"
        required: false
        default: "android-arm64"
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-arm,android-arm64
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.3"

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        # v4 is deprecated (Node 20) and GitHub says it stops receiving updates.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Adapt machine-local Gradle settings
        # android/gradle.properties is tuned for the developer's laptop: it
        # pins org.gradle.java.home to a Windows JDK path that does not exist
        # here, and it caps the daemon heap at 1100 MB. R8 needs more than
        # 1100 MB on this app - run #6 died in :app:minifyReleaseWithR8 with
        # "ERROR: R8: java.lang.OutOfMemoryError: Java heap space". The runner
        # has RAM to spare, so the heap is raised here instead of loosening
        # the limit on the laptop that cannot afford it.
        run: |
          sed -i '/^org.gradle.java.home=/d' android/gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m/' android/gradle.properties
          grep -E '^org\.gradle' android/gradle.properties

      - name: Make sure compileSdk 36 is installed
        # 36 is Flutter 3.44's default flutter.compileSdkVersion. Runner images
        # do not always carry the newest platform, and AGP's own download is not
        # guaranteed to be allowed for it.
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$sdk"
          ls "$sdk/platforms" || true
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$sdk/platforms/android-36" ] && [ -x "$mgr" ]; then
            yes | "$mgr" --sdk_root="$sdk" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Read the version from pubspec.yaml
        id: ver
        run: |
          raw=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | tr -d '\r')
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"
          echo "full=$raw" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $raw"

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "${{ steps.ver.outputs.name }}" ]; then
            echo "::warning::tag v$tag does not match pubspec.yaml version ${{ steps.ver.outputs.name }}"
          fi

      - name: Detect the signing identity
        # The `secrets` context is not readable from a step's `if:`, so the
        # presence of the keystore becomes a step output that later steps can
        # branch on. Only a boolean leaves this step.
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the signing identity
        if: steps.sign.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_FILE_NAME: ${{ secrets.KEYSTORE_FILE_NAME }}
        run: |
          set -eu
          name="${KEYSTORE_FILE_NAME:-navigo.keystore}"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "android/app/$name"
          {
            printf 'storeFile=%s\n' "$name"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/app/key.properties
          chmod 600 android/app/*.keystore android/app/key.properties
          echo "signing identity restored as android/app/$name"

      - name: Warn when there is no signing identity
        if: steps.sign.outputs.present == 'false'
        run: |
          echo "::warning::KEYSTORE_BASE64 is not set, so this APK is signed"
          echo "::warning::with the runner's throwaway debug key and cannot be"
          echo "::warning::installed over an existing Navigo. See the secrets list"
          echo "::warning::at the top of .github/workflows/release.yml."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve which ABIs to build
        id: abi
        run: |
          # A manual run honours the chosen ABI; a tag always ships the full
          # set, so a GitHub Release never contains an arm64-only surprise.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "platform=${{ inputs.target_platform }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform=android-arm,android-arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        # GitHub hides the raw log from anyone who is not signed in, but the
        # annotations of a public run are readable by everyone, so a failed
        # build reports its own Gradle error here instead of just "exit 1".
        run: |
          set +e
          flutter build apk --release --split-per-abi \
            --target-platform "${{ steps.abi.outputs.platform }}" \
            > build.log 2>&1
          rc=$?
          {
            echo "flutter build exit code: $rc"
            echo "--- what went wrong ---"
            sed -n '/What went wrong/,/^\* Try/p' build.log | tail -n 45
            echo "--- tail of the log ---"
            grep -vE '^\s*$' build.log | tail -n 45
          } > build-report.txt
          if [ "$rc" -ne 0 ]; then
            msg=$(sed 's/%/%25/g' build-report.txt | paste -sd '%0A' -)
            echo "::error title=flutter build failed (exit $rc)::$msg"
          else
            tail -n 15 build-report.txt
          fi
          exit "$rc"

      - name: Collect artifacts
        run: |
          set -eu
          mkdir -p out
          v=${{ steps.ver.outputs.full }}
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "out/Navigo-${v}-${abi}.apk"
          done
          ls -la out

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          {
            printf '## Navigo %s\n\n' "$GITHUB_REF_NAME"
            printf 'Built by GitHub Actions from this tag on a clean runner:\n\n'
            printf '```\nflutter build apk --release --split-per-abi\n```\n\n'
            printf '| File | ABI |\n| --- | --- |\n'
            for f in out/*.apk; do
              abi=$(basename "$f" | sed 's/.*-\([a-z0-9-]*\)\.apk$/\1/')
              printf '| `%s` | %s |\n' "$(basename "$f")" "$abi"
            done
            printf '\nMap data (c) OpenStreetMap contributors, tiles by OpenFreeMap -\n'
            printf 'the README carries the full data and license list.\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        # Gated on the signing identity on purpose: an APK signed with a
        # runner's throwaway debug key must not be published as a Navigo
        # release that other phones cannot upgrade from.
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Re-running a tag must refresh the same release instead of failing
          # on "already exists", so a corrected build replaces its assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Navigo $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Navigo $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              out/*.apk
          fi
          # Deleting a tag to move it turns its release into a draft, and a
          # draft is invisible to everyone but the author, so a re-run would
          # silently unpublish the app. Always hand it back to the world.
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json tagName,assets \
            --jq '.tagName + ": " + ([.assets[].name] | join(", "))'

      - name: Skip the release when nothing can sign it
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.present == 'false' }}
        run: |
          echo "::notice::No signing identity in this repository, so tag"
          echo "::notice::$GITHUB_REF_NAME was NOT published as a GitHub Release."
          echo "::notice::Add the secrets listed at the top of this workflow,"
          echo "::notice::then re-run it on the tag to release the signed APKs."

      - name: Upload build artifacts
        # Every successful run keeps a downloadable copy: a manual run has no
        # release at all, and an unsigned tag run would otherwise throw the
        # APKs away with the runner.
        uses: actions/upload-artifact@v4
        with:
          name: Navigo-${{ steps.ver.outputs.full }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
